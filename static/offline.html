<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#08090b" />
		<title>Offline | Alan Database</title>
		<style>
			:root { color-scheme: dark; font-family: system-ui, sans-serif; }
			* { box-sizing: border-box; }
			body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 1rem; background: #08090b; color: #f5f7fa; }
			main { width: min(100%, 36rem); padding: clamp(1.5rem, 6vw, 3rem); border: 1px solid rgba(255,255,255,.12); border-radius: 1rem; background: #12151a; }
			span { color: #34d399; font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
			h1 { margin: .75rem 0; font-size: clamp(2rem, 9vw, 3.5rem); line-height: 1; letter-spacing: -.05em; }
			p { color: #aab1bc; line-height: 1.65; }
			button { min-height: 44px; margin-top: 1rem; padding: .65rem 1rem; border: 1px solid rgba(52,211,153,.4); border-radius: .75rem; background: transparent; color: #34d399; font: inherit; font-weight: 700; cursor: pointer; }
			button:focus-visible { outline: 2px solid #34d399; outline-offset: 3px; }
		</style>
	</head>
	<body>
		<main>
			<span>Connection unavailable</span>
			<h1>Alan Database is offline.</h1>
			<p>The requested page was not cached because personal and catalogue data stay network-first. Reconnect, then retry safely.</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
