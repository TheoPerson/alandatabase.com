<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark OLED Background with Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#1f293d" stroke-width="8" />

  <!-- Outer Radar Pulse Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="16 12" opacity="0.3" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#10b981" stroke-width="6" opacity="0.5" filter="url(#glow)" />

  <!-- Cinema Reel / Radar Center Geometry -->
  <circle cx="256" cy="256" r="85" fill="#090d14" stroke="url(#emeraldGrad)" stroke-width="12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="28" fill="#10b981" filter="url(#glow)" />

  <!-- 4 Reel Holes -->
  <circle cx="256" cy="200" r="16" fill="#10b981" opacity="0.8" />
  <circle cx="256" cy="312" r="16" fill="#10b981" opacity="0.8" />
  <circle cx="200" cy="256" r="16" fill="#10b981" opacity="0.8" />
  <circle cx="312" cy="256" r="16" fill="#10b981" opacity="0.8" />

  <!-- Top-Right Radar Scan Beam -->
  <line x1="256" y1="256" x2="390" y2="122" stroke="#34d399" stroke-width="8" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="390" cy="122" r="10" fill="#34d399" filter="url(#glow)" />
</svg>
