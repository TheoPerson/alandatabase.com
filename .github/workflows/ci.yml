name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Node matches netlify.toml so CI builds what production builds
env:
  NODE_VERSION: '22'
  PNPM_VERSION: 9

jobs:
  quality:
    name: Code Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint & Prettier
        run: pnpm lint

      - name: Svelte Type Check
        run: pnpm check

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Unit Tests
        run: pnpm test:unit -- --run

  # Runs independently of the E2E suite so a broken build can never be hidden behind failing tests
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm build
        env:
          # Only needed at import time; the build never connects to the database
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinema
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: cinema_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cinema:cinema_ci_password@localhost:5432/cinema
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Database Schema
        run: pnpm db:push --force

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      # Non-blocking until the legacy E2E suite is repaired (issue #25);
      # failures still show as a warning annotation and the report is uploaded
      - name: Run Playwright Tests
        id: playwright
        continue-on-error: true
        run: pnpm exec playwright test

      - name: Flag E2E Failures
        if: steps.playwright.outcome == 'failure'
        run: echo "::warning title=E2E::Playwright suite failed (non-blocking). See the playwright-report artifact."

      - name: Upload Playwright Report
        if: steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
