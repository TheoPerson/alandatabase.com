name: CI Pipeline

on:
  push:
    branches: ['main', 'agent/v3-foundation-core']
  pull_request:
    branches: ['main', 'agent/v3-foundation-core']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Types
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.15.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint & Prettier
        run: pnpm lint

      - name: Svelte Type Check
        run: pnpm check

  tests:
    name: Unit & E2E Tests
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/alan_test
      RATE_LIMIT_HASH_KEY: ci-only-rate-limit-key
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.15.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Test Database Migrations
        run: pnpm db:migrate

      - name: Run Unit Tests
        run: pnpm test:unit -- --run

      - name: Run Worker Tests
        run: pnpm --dir worker test

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright Tests
        run: pnpm test:e2e

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.15.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: pnpm build

      - name: Build Worker
        run: pnpm --dir worker build
